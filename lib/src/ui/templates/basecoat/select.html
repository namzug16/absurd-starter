<x-props id="String" name="String" label="String" value="String" multiple="bool" objectFormat="bool" placeholder="String?" hasPlaceholder="bool" closeOnSelect="bool" items="List<Fragment>" body="Fragment?" mainAttrs="Map<String, String>" triggerAttrs="Map<String, String>" popoverAttrs="Map<String, String>" listboxAttrs="Map<String, String>" inputAttrs="Map<String, String>"></x-props>
<div id="{{ id }}" <x-if case="objectFormat">data-format="object" </x-if><x-if case="hasPlaceholder">data-placeholder="{{ placeholder }}" </x-if><x-if case="closeOnSelect">data-close-on-select="true" </x-if><x-for in="mainAttrs.entries" as="attr">{{ attr.key }}="{{ attr.value }}" </x-for>>
  <button type="button" id="{{ id }}-trigger" aria-haspopup="listbox" aria-expanded="false" aria-controls="{{ id }}-listbox" <x-for in="triggerAttrs.entries" as="attr">{{ attr.key }}="{{ attr.value }}" </x-for>>
    <span class="truncate">{{ label }}</span>
    <i data-lucide="chevron-down" class="text-muted-foreground opacity-50 shrink-0" aria-hidden="true"></i>
  </button>
  <div id="{{ id }}-popover" data-popover aria-hidden="true" <x-for in="popoverAttrs.entries" as="attr">{{ attr.key }}="{{ attr.value }}" </x-for>>
    <div role="listbox" id="{{ id }}-listbox" aria-orientation="vertical" aria-labelledby="{{ id }}-trigger" <x-if case="multiple">aria-multiselectable="true" </x-if><x-for in="listboxAttrs.entries" as="attr">{{ attr.key }}="{{ attr.value }}" </x-for>>{{ items }}{{ body }}</div>
  </div>
  <input type="hidden" name="{{ name }}" value="{{ value }}" <x-for in="inputAttrs.entries" as="attr">{{ attr.key }}="{{ attr.value }}" </x-for>>
</div>
