<x-props id="String" name="String" label="String" value="String" multiple="bool" objectFormat="bool" placeholder="String?" hasPlaceholder="bool" closeOnSelect="bool" items="List<Fragment>" body="Fragment?" mainAttrs="Map<String, String>" triggerAttrs="Map<String, String>" popoverAttrs="Map<String, String>" listboxAttrs="Map<String, String>" inputAttrs="Map<String, String>"></x-props>
<div id="{{ id }}" ?objectFormat:data-format="object" ?hasPlaceholder:data-placeholder="{{ placeholder }}" ?closeOnSelect:data-close-on-select="true" ...mainAttrs>
  <button type="button" id="{{ id }}-trigger" aria-haspopup="listbox" aria-expanded="false" aria-controls="{{ id }}-listbox" ...triggerAttrs>
    <span class="truncate">{{ label }}</span>
    <i data-lucide="chevron-down" class="text-muted-foreground opacity-50 shrink-0" aria-hidden="true"></i>
  </button>
  <div id="{{ id }}-popover" data-popover aria-hidden="true" ...popoverAttrs>
    <div role="listbox" id="{{ id }}-listbox" aria-orientation="vertical" aria-labelledby="{{ id }}-trigger" ?multiple:aria-multiselectable="true" ...listboxAttrs>{{ items }}{{ body }}</div>
  </div>
  <input type="hidden" name="{{ name }}" value="{{ value }}" ...inputAttrs>
</div>
