<x-props id="String" label="String" command="bool" other="bool" children="List<Fragment>" attrs="Map<String, String>"></x-props>
<div role="group" aria-labelledby="{{ id }}" <x-for in="attrs.entries" as="attr">{{ attr.key }}="{{ attr.value }}" </x-for>>
  <x-if case="command"><span role="heading" id="{{ id }}">{{ label }}</span></x-if>
  <x-if case="other"><div role="heading" id="{{ id }}">{{ label }}</div></x-if>
  {{ children }}
</div>
