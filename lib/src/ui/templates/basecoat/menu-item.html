<x-props id="String" href="String?" link="bool" role="String" icon="Fragment?" content="Fragment" attrs="Map<String, String>"></x-props>
<x-if case="link"><a id="{{ id }}" href="{{ href }}" role="{{ role }}" ...attrs>{{ icon }}{{ content }}</a></x-if>
<x-if-not case="link"><div id="{{ id }}" role="{{ role }}" ...attrs>{{ icon }}{{ content }}</div></x-if-not>
