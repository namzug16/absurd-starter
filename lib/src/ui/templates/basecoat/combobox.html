<x-props id="String" name="String?" hasName="bool" value="String" multiple="bool" objectFormat="bool" closeOnSelect="bool" autoHighlight="bool" clear="bool" plain="bool" input="Fragment" items="List<Fragment>" body="Fragment?" mainAttrs="Map<String, String>" groupAttrs="Map<String, String>" popoverAttrs="Map<String, String>" listboxAttrs="Map<String, String>" hiddenInputAttrs="Map<String, String>"></x-props>
<div id="{{ id }}" ?objectFormat:data-format="object" ?closeOnSelect:data-close-on-select="true" ?autoHighlight:data-auto-highlight="true" ...mainAttrs>
  <x-if case="multiple">{{ input }}</x-if>
  <x-if case="clear">
    <div ...groupAttrs>
      {{ input }}
      <span role="group" data-align="inline-end">
        <button type="button" data-clear aria-label="Clear selection"><i data-lucide="x" class="size-4" aria-hidden="true"></i></button>
        <button type="button" class="btn" data-variant="ghost" data-size="icon-xs" aria-label="Open suggestions" aria-haspopup="listbox" aria-expanded="false" aria-controls="{{ id }}-listbox"><i data-lucide="chevron-down" aria-hidden="true"></i></button>
      </span>
    </div>
  </x-if>
  <x-if case="plain">{{ input }}<i data-lucide="chevron-down" class="combobox-trigger-icon" aria-hidden="true"></i></x-if>
  <div id="{{ id }}-popover" data-popover aria-hidden="true" ...popoverAttrs>
    <div role="listbox" id="{{ id }}-listbox" aria-orientation="vertical" ?multiple:aria-multiselectable="true" ...listboxAttrs>{{ items }}{{ body }}</div>
  </div>
  <input type="hidden" ?hasName:name="{{ name }}" value="{{ value }}" ...hiddenInputAttrs>
</div>
