<x-props id="String" orientation="String" buttons="List<Fragment>" panels="List<Fragment>" mainAttrs="Map<String, String>" tablistAttrs="Map<String, String>"></x-props>
<div id="{{ id }}" <x-for in="mainAttrs.entries" as="attr">{{ attr.key }}="{{ attr.value }}" </x-for>>
  <nav role="tablist" aria-orientation="{{ orientation }}" <x-for in="tablistAttrs.entries" as="attr">{{ attr.key }}="{{ attr.value }}" </x-for>>{{ buttons }}</nav>
  {{ panels }}
</div>
