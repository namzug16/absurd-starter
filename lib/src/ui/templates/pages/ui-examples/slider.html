<section id="slider" class="scroll-mt-20 space-y-6">
  <header class="flex items-center justify-between gap-4 border-b pb-4">
    <h2 class="text-2xl font-semibold tracking-tight">Slider</h2>
    <a href="https://basecoatui.com/components/slider" target="_blank" rel="noreferrer" class="btn" data-variant="ghost" data-size="sm">Docs<i data-lucide="arrow-up-right" data-icon="inline-end" aria-hidden="true"></i></a>
  </header>
  <article class="space-y-3">
    <h3 class="text-sm font-medium text-muted-foreground">Default</h3>
    <div class="flex min-h-40 flex-wrap items-center justify-center gap-4 rounded-xl border p-6 sm:p-10">
      <div class="w-full max-w-sm">
        <input type="range" class="input w-full" min="0" max="100" value="50" />
      </div>
    </div>
  </article>
  <article class="space-y-3">
    <h3 class="text-sm font-medium text-muted-foreground">Label</h3>
    <div class="flex min-h-40 flex-wrap items-center justify-center gap-4 rounded-xl border p-6 sm:p-10">
      <div class="w-full max-w-sm">
        <div class="grid w-full gap-1 max-w-sm">
          <div class="flex items-center justify-between gap-2">
            <label class="label" for="temperature">Temperature</label>
            <output class="text-sm text-muted-foreground" for="temperature">50</output>
          </div>
          <input
            id="temperature"
            type="range"
            class="input w-full"
            min="0"
            max="100"
            value="50"
            oninput="this.previousElementSibling.querySelector('output').value = this.value"
          />
        </div>
      </div>
    </div>
  </article>
  <article class="space-y-3">
    <h3 class="text-sm font-medium text-muted-foreground">Disabled</h3>
    <div class="flex min-h-40 flex-wrap items-center justify-center gap-4 rounded-xl border p-6 sm:p-10">
      <div class="w-full max-w-sm">
        <input type="range" class="input w-full" min="0" max="100" value="50" disabled />
      </div>
    </div>
  </article>
  <article class="space-y-3">
    <h3 class="text-sm font-medium text-muted-foreground">RTL</h3>
    <div class="flex min-h-40 flex-wrap items-center justify-center gap-4 rounded-xl border p-6 sm:p-10">
      <div class="w-full max-w-sm">
        <input type="range" class="input w-full" min="0" max="100" value="50" dir="rtl" />
      </div>
    </div>
  </article>
</section>
