<section id="kbd" class="scroll-mt-20 space-y-6">
  <header class="flex items-center justify-between gap-4 border-b pb-4">
    <h2 class="text-2xl font-semibold tracking-tight">Kbd</h2>
    <a href="https://basecoatui.com/components/kbd" target="_blank" rel="noreferrer" class="btn" data-variant="ghost" data-size="sm">Docs<i data-lucide="arrow-up-right" data-icon="inline-end" aria-hidden="true"></i></a>
  </header>
  <article class="space-y-3">
    <h3 class="text-sm font-medium text-muted-foreground">Group</h3>
    <div class="flex min-h-40 flex-wrap items-center justify-center gap-4 rounded-xl border p-6 sm:p-10">
      <p class="text-muted-foreground text-sm">Use <span class="inline-flex items-center gap-1"><kbd class="kbd">Ctrl</kbd><span>+</span><kbd class="kbd">B</kbd></span> <span class="inline-flex items-center gap-1"><kbd class="kbd">Ctrl</kbd><span>+</span><kbd class="kbd">K</kbd></span> to open the command palette</p>
    </div>
  </article>
  <article class="space-y-3">
    <h3 class="text-sm font-medium text-muted-foreground">Button</h3>
    <div class="flex min-h-40 flex-wrap items-center justify-center gap-4 rounded-xl border p-6 sm:p-10">
      <button class="btn" data-variant="outline">
        Accept
        <kbd class="kbd translate-x-0.5" data-icon="inline-end">⏎</kbd>
      </button>
    </div>
  </article>
  <article class="space-y-3">
    <h3 class="text-sm font-medium text-muted-foreground">Input Group</h3>
    <div class="flex min-h-40 flex-wrap items-center justify-center gap-4 rounded-xl border p-6 sm:p-10">
      <div class="w-full max-w-xs">
        <div class="input-group">
          <input type="search" placeholder="Search..." />
          <span data-align="start" aria-hidden="true"><i data-lucide="search" aria-hidden="true"></i></span>
          <span class="inline-flex items-center gap-1" data-align="end">
            <kbd class="kbd">⌘</kbd>
            <kbd class="kbd">K</kbd>
          </span>
        </div>
      </div>
    </div>
  </article>
  <article class="space-y-3">
    <h3 class="text-sm font-medium text-muted-foreground">RTL</h3>
    <div class="flex min-h-40 flex-wrap items-center justify-center gap-4 rounded-xl border p-6 sm:p-10">
      <div class="flex flex-col items-center gap-4" dir="rtl">
        <span class="inline-flex items-center gap-1">
          <kbd class="kbd">⌘</kbd>
          <kbd class="kbd">⇧</kbd>
          <kbd class="kbd">⌥</kbd>
          <kbd class="kbd">⌃</kbd>
        </span>
        <span class="inline-flex items-center gap-1">
          <kbd class="kbd">Ctrl</kbd>
          <span>+</span>
          <kbd class="kbd">B</kbd>
        </span>
      </div>
    </div>
  </article>
</section>
