<section id="progress" class="scroll-mt-20 space-y-6">
  <header class="flex items-center justify-between gap-4 border-b pb-4">
    <h2 class="text-2xl font-semibold tracking-tight">Progress</h2>
    <a href="https://basecoatui.com/components/progress" target="_blank" rel="noreferrer" class="btn" data-variant="ghost" data-size="sm">Docs<i data-lucide="arrow-up-right" data-icon="inline-end" aria-hidden="true"></i></a>
  </header>
  <article class="space-y-3">
    <h3 class="text-sm font-medium text-muted-foreground">Label</h3>
    <div class="flex min-h-40 flex-wrap items-center justify-center gap-4 rounded-xl border p-6 sm:p-10">
      <div class="w-full max-w-sm">
        <div class="field">
          <div class="flex items-center gap-3 text-sm">
            <label id="progress-label">Upload progress</label>
            <output class="ms-auto tabular-nums">66%</output>
          </div>
          <div class="progress" role="progressbar" aria-labelledby="progress-label" aria-valuenow="66" aria-valuemin="0" aria-valuemax="100">
            <span style="width: 66%"></span>
          </div>
        </div>
      </div>
    </div>
  </article>
  <article class="space-y-3">
    <h3 class="text-sm font-medium text-muted-foreground">RTL</h3>
    <div class="flex min-h-40 flex-wrap items-center justify-center gap-4 rounded-xl border p-6 sm:p-10">
      <div class="w-full max-w-sm">
        <div class="field w-full" dir="rtl">
          <label id="progress-upload-rtl" for="progress-upload">تقدم الرفع <span class="ms-auto">٦٦%</span></label>
          <div id="progress-upload" class="progress" role="progressbar" aria-labelledby="progress-upload-rtl" aria-valuenow="66" aria-valuemin="0" aria-valuemax="100">
            <span style="width: 66%"></span>
          </div>
        </div>
      </div>
    </div>
  </article>
</section>
