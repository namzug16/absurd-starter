<section id="button" class="scroll-mt-20 space-y-6">
  <header class="flex items-center justify-between gap-4 border-b pb-4">
    <h2 class="text-2xl font-semibold tracking-tight">Button</h2>
    <a href="https://basecoatui.com/components/button" target="_blank" rel="noreferrer" class="btn" data-variant="ghost" data-size="sm">Docs<i data-lucide="arrow-up-right" data-icon="inline-end" aria-hidden="true"></i></a>
  </header>
  <article class="space-y-3">
    <h3 class="text-sm font-medium text-muted-foreground">Size</h3>
    <div class="flex min-h-40 flex-wrap items-center justify-center gap-4 rounded-xl border p-6 sm:p-10">
      <div class="flex flex-wrap items-center gap-2">
        <button type="button" class="btn" data-variant="outline" data-size="xs">Extra Small</button>
        <button type="button" class="btn" data-variant="outline" data-size="icon-xs" aria-label="Submit"><i data-lucide="arrow-up-right" aria-hidden="true"></i></button>
        <button type="button" class="btn" data-variant="outline" data-size="sm">Small</button>
        <button type="button" class="btn" data-variant="outline" data-size="icon-sm" aria-label="Submit"><i data-lucide="arrow-up-right" aria-hidden="true"></i></button>
        <button type="button" class="btn" data-variant="outline">Default</button>
        <button type="button" class="btn" data-variant="outline" data-size="icon" aria-label="Submit"><i data-lucide="arrow-up-right" aria-hidden="true"></i></button>
        <button type="button" class="btn" data-variant="outline" data-size="lg">Large</button>
        <button type="button" class="btn" data-variant="outline" data-size="icon-lg" aria-label="Submit"><i data-lucide="arrow-up-right" aria-hidden="true"></i></button>
      </div>
    </div>
  </article>
  <article class="space-y-3">
    <h3 class="text-sm font-medium text-muted-foreground">Default</h3>
    <div class="flex min-h-40 flex-wrap items-center justify-center gap-4 rounded-xl border p-6 sm:p-10">
      <button type="button" class="btn">Button</button>
    </div>
  </article>
  <article class="space-y-3">
    <h3 class="text-sm font-medium text-muted-foreground">Outline</h3>
    <div class="flex min-h-40 flex-wrap items-center justify-center gap-4 rounded-xl border p-6 sm:p-10">
      <button type="button" class="btn" data-variant="outline">Outline</button>
    </div>
  </article>
  <article class="space-y-3">
    <h3 class="text-sm font-medium text-muted-foreground">Secondary</h3>
    <div class="flex min-h-40 flex-wrap items-center justify-center gap-4 rounded-xl border p-6 sm:p-10">
      <button type="button" class="btn" data-variant="secondary">Secondary</button>
    </div>
  </article>
  <article class="space-y-3">
    <h3 class="text-sm font-medium text-muted-foreground">Ghost</h3>
    <div class="flex min-h-40 flex-wrap items-center justify-center gap-4 rounded-xl border p-6 sm:p-10">
      <button type="button" class="btn" data-variant="ghost">Ghost</button>
    </div>
  </article>
  <article class="space-y-3">
    <h3 class="text-sm font-medium text-muted-foreground">Destructive</h3>
    <div class="flex min-h-40 flex-wrap items-center justify-center gap-4 rounded-xl border p-6 sm:p-10">
      <button type="button" class="btn" data-variant="destructive">Destructive</button>
    </div>
  </article>
  <article class="space-y-3">
    <h3 class="text-sm font-medium text-muted-foreground">Link</h3>
    <div class="flex min-h-40 flex-wrap items-center justify-center gap-4 rounded-xl border p-6 sm:p-10">
      <button type="button" class="btn" data-variant="link">Link</button>
    </div>
  </article>
  <article class="space-y-3">
    <h3 class="text-sm font-medium text-muted-foreground">Icon</h3>
    <div class="flex min-h-40 flex-wrap items-center justify-center gap-4 rounded-xl border p-6 sm:p-10">
      <button type="button" class="btn" data-variant="outline" data-size="icon" aria-label="Open"><i data-lucide="circle-fading-arrow-up" aria-hidden="true"></i></button>
    </div>
  </article>
  <article class="space-y-3">
    <h3 class="text-sm font-medium text-muted-foreground">With icon</h3>
    <div class="flex min-h-40 flex-wrap items-center justify-center gap-4 rounded-xl border p-6 sm:p-10">
      <button type="button" class="btn" data-variant="outline" data-size="sm"><i data-lucide="git-branch" data-icon="inline-start" aria-hidden="true"></i>
        New Branch
      </button>
    </div>
  </article>
  <article class="space-y-3">
    <h3 class="text-sm font-medium text-muted-foreground">Rounded</h3>
    <div class="flex min-h-40 flex-wrap items-center justify-center gap-4 rounded-xl border p-6 sm:p-10">
      <button type="button" class="btn rounded-full" data-variant="outline" data-size="icon" aria-label="Scroll up"><i data-lucide="arrow-up" aria-hidden="true"></i></button>
    </div>
  </article>
  <article class="space-y-3">
    <h3 class="text-sm font-medium text-muted-foreground">Spinner</h3>
    <div class="flex min-h-40 flex-wrap items-center justify-center gap-4 rounded-xl border p-6 sm:p-10">
      <div class="flex flex-wrap items-center gap-2">
        <button type="button" class="btn" disabled><i data-lucide="loader-circle" data-icon="inline-start" class="animate-spin" aria-hidden="true"></i>
          Generating
        </button>
        <button type="button" class="btn" data-variant="secondary" disabled>
          Downloading
          <i data-lucide="loader-circle" data-icon="inline-end" class="animate-spin" aria-hidden="true"></i>
        </button>
      </div>
    </div>
  </article>
  <article class="space-y-3">
    <h3 class="text-sm font-medium text-muted-foreground">Button group</h3>
    <div class="flex min-h-40 flex-wrap items-center justify-center gap-4 rounded-xl border p-6 sm:p-10">
      <div class="flex w-fit items-stretch gap-2">
        <button type="button" class="btn" data-variant="outline" data-size="icon" aria-label="Go back"><i data-lucide="arrow-left" aria-hidden="true"></i></button>
        <div role="group" class="button-group">
          <button type="button" class="btn" data-variant="outline">Archive</button>
          <button type="button" class="btn" data-variant="outline">Report</button>
        </div>
        <div role="group" class="button-group">
          <button type="button" class="btn" data-variant="outline">Snooze</button>
          <div id="button-docs-actions" class="dropdown-menu">
            <button type="button" id="button-docs-actions-trigger" aria-label="More options" aria-haspopup="menu" aria-controls="button-docs-actions-menu" aria-expanded="false" class="btn" data-variant="outline" data-size="icon"><i data-lucide="ellipsis" aria-hidden="true"></i></button>
            <div id="button-docs-actions-popover" data-popover aria-hidden="true" data-align="end">
              <div role="menu" id="button-docs-actions-menu" aria-labelledby="button-docs-actions-trigger">
                <div role="menuitem"><i data-lucide="mail-check" aria-hidden="true"></i>
                  Mark as Read
                </div>
                <div role="menuitem"><i data-lucide="archive" aria-hidden="true"></i>
                  Archive
                </div>
                <hr role="separator" />
                <div role="menuitem"><i data-lucide="clock" aria-hidden="true"></i>
                  Snooze
                </div>
                <div role="menuitem"><i data-lucide="calendar" aria-hidden="true"></i>
                  Add to Calendar
                </div>
                <div role="menuitem"><i data-lucide="list-filter-plus" aria-hidden="true"></i>
                  Add to List
                </div>
                <hr role="separator" />
                <div role="menuitem" class="text-destructive hover:bg-destructive/10 dark:hover:bg-destructive/20 focus:bg-destructive/10 dark:focus:bg-destructive/20 focus:text-destructive [&_svg]:!text-destructive"><i data-lucide="trash-2" aria-hidden="true"></i>
                  Trash
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </article>
  <article class="space-y-3">
    <h3 class="text-sm font-medium text-muted-foreground">RTL</h3>
    <div class="flex min-h-40 flex-wrap items-center justify-center gap-4 rounded-xl border p-6 sm:p-10">
      <div dir="rtl" class="flex flex-wrap items-center gap-2">
        <button type="button" class="btn" data-variant="outline">زر</button>
        <button type="button" class="btn" data-variant="destructive">حذف</button>
        <button type="button" class="btn" data-variant="outline">
          إرسال
          <i data-lucide="arrow-right" data-icon="inline-end" class="rtl:rotate-180" aria-hidden="true"></i>
        </button>
        <button type="button" class="btn" data-variant="outline" data-size="icon" aria-label="Add"><i data-lucide="plus" aria-hidden="true"></i></button>
        <button type="button" class="btn" data-variant="secondary" disabled><i data-lucide="loader-circle" data-icon="inline-start" class="animate-spin" aria-hidden="true"></i>
          جاري التحميل
        </button>
      </div>
    </div>
  </article>
</section>
