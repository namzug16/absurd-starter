<section id="avatar" class="scroll-mt-20 space-y-6">
  <header class="flex items-center justify-between gap-4 border-b pb-4">
    <h2 class="text-2xl font-semibold tracking-tight">Avatar</h2>
    <a href="https://basecoatui.com/components/avatar" target="_blank" rel="noreferrer" class="btn" data-variant="ghost" data-size="sm">Docs<i data-lucide="arrow-up-right" data-icon="inline-end" aria-hidden="true"></i></a>
  </header>
  <article class="space-y-3">
    <h3 class="text-sm font-medium text-muted-foreground">Basic</h3>
    <div class="flex min-h-40 flex-wrap items-center justify-center gap-4 rounded-xl border p-6 sm:p-10">
      <span class="avatar">
        <img src="https://github.com/shadcn.png" alt="@shadcn" />
        <span>CN</span>
      </span>
    </div>
  </article>
  <article class="space-y-3">
    <h3 class="text-sm font-medium text-muted-foreground">Badge</h3>
    <div class="flex min-h-40 flex-wrap items-center justify-center gap-4 rounded-xl border p-6 sm:p-10">
      <span class="avatar">
        <img src="https://github.com/shadcn.png" alt="@shadcn" />
        <span>CN</span>
        <span class="avatar-badge bg-green-600 dark:bg-green-800"></span>
      </span>
    </div>
  </article>
  <article class="space-y-3">
    <h3 class="text-sm font-medium text-muted-foreground">Badge with icon</h3>
    <div class="flex min-h-40 flex-wrap items-center justify-center gap-4 rounded-xl border p-6 sm:p-10">
      <span class="avatar">
        <img src="https://github.com/pranathip.png" alt="@pranathip" />
        <span>PP</span>
        <span class="avatar-badge"><i data-lucide="plus" aria-hidden="true"></i></span>
      </span>
    </div>
  </article>
  <article class="space-y-3">
    <h3 class="text-sm font-medium text-muted-foreground">Avatar group</h3>
    <div class="flex min-h-40 flex-wrap items-center justify-center gap-4 rounded-xl border p-6 sm:p-10">
      <div class="avatar-group">
        <span class="avatar"><img src="https://github.com/shadcn.png" alt="@shadcn" /><span>CN</span></span>
        <span class="avatar"><img src="https://github.com/maxleiter.png" alt="@maxleiter" /><span>LR</span></span>
        <span class="avatar"><img src="https://github.com/evilrabbit.png" alt="@evilrabbit" /><span>ER</span></span>
      </div>
    </div>
  </article>
  <article class="space-y-3">
    <h3 class="text-sm font-medium text-muted-foreground">Avatar group count</h3>
    <div class="flex min-h-40 flex-wrap items-center justify-center gap-4 rounded-xl border p-6 sm:p-10">
      <div class="avatar-group">
        <span class="avatar"><img src="https://github.com/shadcn.png" alt="@shadcn" /><span>CN</span></span>
        <span class="avatar"><img src="https://github.com/maxleiter.png" alt="@maxleiter" /><span>LR</span></span>
        <span class="avatar"><img src="https://github.com/evilrabbit.png" alt="@evilrabbit" /><span>ER</span></span>
        <span data-count>+3</span>
      </div>
    </div>
  </article>
  <article class="space-y-3">
    <h3 class="text-sm font-medium text-muted-foreground">Avatar group with icon</h3>
    <div class="flex min-h-40 flex-wrap items-center justify-center gap-4 rounded-xl border p-6 sm:p-10">
      <div class="avatar-group">
        <span class="avatar"><img src="https://github.com/shadcn.png" alt="@shadcn" /><span>CN</span></span>
        <span class="avatar"><img src="https://github.com/maxleiter.png" alt="@maxleiter" /><span>LR</span></span>
        <span class="avatar"><img src="https://github.com/evilrabbit.png" alt="@evilrabbit" /><span>ER</span></span>
        <span data-count aria-label="Additional avatars"><i data-lucide="plus" aria-hidden="true"></i></span>
      </div>
    </div>
  </article>
  <article class="space-y-3">
    <h3 class="text-sm font-medium text-muted-foreground">Sizes</h3>
    <div class="flex min-h-40 flex-wrap items-center justify-center gap-4 rounded-xl border p-6 sm:p-10">
      <div class="grid gap-2">
        <div class="flex flex-wrap items-center gap-2">
          <span class="avatar" data-size="sm">
            <img src="https://github.com/shadcn.png" alt="@shadcn" />
            <span>CN</span>
          </span>
          <span class="avatar">
            <img src="https://github.com/shadcn.png" alt="@shadcn" />
            <span>CN</span>
          </span>
          <span class="avatar" data-size="lg">
            <img src="https://github.com/shadcn.png" alt="@shadcn" />
            <span>CN</span>
          </span>
        </div>
        <div class="flex flex-wrap items-center gap-2">
          <span class="avatar" data-size="sm"><span>CN</span></span>
          <span class="avatar"><span>CN</span></span>
          <span class="avatar" data-size="lg"><span>CN</span></span>
        </div>
      </div>
    </div>
  </article>
  <article class="space-y-3">
    <h3 class="text-sm font-medium text-muted-foreground">Dropdown</h3>
    <div class="flex min-h-40 flex-wrap items-center justify-center gap-4 rounded-xl border p-6 sm:p-10">
      <div class="dropdown-menu">
        <button type="button" id="avatar-dropdown-trigger" aria-label="Open user menu" aria-haspopup="menu" aria-controls="avatar-dropdown-menu" aria-expanded="false" class="btn rounded-full" data-variant="ghost" data-size="icon">
          <span class="avatar">
            <img src="https://github.com/shadcn.png" alt="@shadcn" />
            <span>CN</span>
          </span>
        </button>
        <div data-popover aria-hidden="true" class="w-32">
          <div role="menu" id="avatar-dropdown-menu" aria-labelledby="avatar-dropdown-trigger">
            <div role="menuitem">Profile</div>
            <div role="menuitem">Billing</div>
            <div role="menuitem">Settings</div>
            <hr role="separator" />
            <div role="menuitem" data-variant="destructive">Log out</div>
          </div>
        </div>
      </div>
    </div>
  </article>
  <article class="space-y-3">
    <h3 class="text-sm font-medium text-muted-foreground">RTL</h3>
    <div class="flex min-h-40 flex-wrap items-center justify-center gap-4 rounded-xl border p-6 sm:p-10">
      <div class="flex flex-row flex-wrap items-center gap-12" dir="rtl">
        <span class="avatar">
          <img src="https://github.com/shadcn.png" alt="@shadcn" />
          <span>CN</span>
        </span>
        <span class="avatar rounded-lg">
          <img src="https://github.com/evilrabbit.png" alt="@evilrabbit" />
          <span>ER</span>
        </span>
        <div class="avatar-group [&_.avatar]:grayscale">
          <span class="avatar"><img src="https://github.com/shadcn.png" alt="@shadcn" /><span>CN</span></span>
          <span class="avatar"><img src="https://github.com/maxleiter.png" alt="@maxleiter" /><span>LR</span></span>
          <span class="avatar"><img src="https://github.com/evilrabbit.png" alt="@evilrabbit" /><span>ER</span></span>
        </div>
      </div>
    </div>
  </article>
</section>
