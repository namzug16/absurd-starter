<section id="badge" class="scroll-mt-20 space-y-6">
  <header class="flex items-center justify-between gap-4 border-b pb-4">
    <h2 class="text-2xl font-semibold tracking-tight">Badge</h2>
    <a href="https://basecoatui.com/components/badge" target="_blank" rel="noreferrer" class="btn" data-variant="ghost" data-size="sm">Docs<i data-lucide="arrow-up-right" data-icon="inline-end" aria-hidden="true"></i></a>
  </header>
  <article class="space-y-3">
    <h3 class="text-sm font-medium text-muted-foreground">Variants</h3>
    <div class="flex min-h-40 flex-wrap items-center justify-center gap-4 rounded-xl border p-6 sm:p-10">
      <div class="flex flex-wrap gap-2">
        <span class="badge">Default</span>
        <span class="badge" data-variant="secondary">Secondary</span>
        <span class="badge" data-variant="destructive">Destructive</span>
        <span class="badge" data-variant="outline">Outline</span>
        <span class="badge" data-variant="ghost">Ghost</span>
      </div>
    </div>
  </article>
  <article class="space-y-3">
    <h3 class="text-sm font-medium text-muted-foreground">With icon</h3>
    <div class="flex min-h-40 flex-wrap items-center justify-center gap-4 rounded-xl border p-6 sm:p-10">
      <div class="flex flex-wrap gap-2">
        <span class="badge"><i data-lucide="badge-check" data-icon="inline-start" aria-hidden="true"></i>
          Verified
        </span>
        <span class="badge" data-variant="secondary">
          Bookmark
          <i data-lucide="bookmark" data-icon="inline-end" aria-hidden="true"></i>
        </span>
      </div>
    </div>
  </article>
  <article class="space-y-3">
    <h3 class="text-sm font-medium text-muted-foreground">With spinner</h3>
    <div class="flex min-h-40 flex-wrap items-center justify-center gap-4 rounded-xl border p-6 sm:p-10">
      <div class="flex flex-wrap gap-2">
        <span class="badge" data-variant="destructive"><i data-lucide="loader-circle" aria-label="Loading" role="status" data-icon="inline-start" class="animate-spin"></i>
          Deleting
        </span>
        <span class="badge" data-variant="secondary">
          Generating
          <i data-lucide="loader-circle" aria-label="Loading" role="status" data-icon="inline-end" class="animate-spin"></i>
        </span>
      </div>
    </div>
  </article>
  <article class="space-y-3">
    <h3 class="text-sm font-medium text-muted-foreground">Link</h3>
    <div class="flex min-h-40 flex-wrap items-center justify-center gap-4 rounded-xl border p-6 sm:p-10">
      <a href="#" class="badge">
        Open Link
        <i data-lucide="arrow-up-right" data-icon="inline-end" aria-hidden="true"></i>
      </a>
    </div>
  </article>
  <article class="space-y-3">
    <h3 class="text-sm font-medium text-muted-foreground">Custom colors</h3>
    <div class="flex min-h-40 flex-wrap items-center justify-center gap-4 rounded-xl border p-6 sm:p-10">
      <div class="flex flex-wrap gap-2">
        <span class="badge bg-blue-50 text-blue-700 dark:bg-blue-950 dark:text-blue-300">Blue</span>
        <span class="badge bg-green-50 text-green-700 dark:bg-green-950 dark:text-green-300">Green</span>
        <span class="badge bg-sky-50 text-sky-700 dark:bg-sky-950 dark:text-sky-300">Sky</span>
        <span class="badge bg-purple-50 text-purple-700 dark:bg-purple-950 dark:text-purple-300">Purple</span>
        <span class="badge bg-red-50 text-red-700 dark:bg-red-950 dark:text-red-300">Red</span>
      </div>
    </div>
  </article>
  <article class="space-y-3">
    <h3 class="text-sm font-medium text-muted-foreground">RTL</h3>
    <div class="flex min-h-40 flex-wrap items-center justify-center gap-4 rounded-xl border p-6 sm:p-10">
      <div dir="rtl" class="flex flex-wrap gap-2">
        <span class="badge">شارة</span>
        <span class="badge" data-variant="secondary">ثانوي</span>
        <span class="badge" data-variant="destructive">مدمر</span>
        <span class="badge" data-variant="outline">مخطط</span>
        <span class="badge"><i data-lucide="badge-check" data-icon="inline-start" aria-hidden="true"></i>
          متحقق
        </span>
        <span class="badge" data-variant="secondary">
          إشارة مرجعية
          <i data-lucide="bookmark" data-icon="inline-end" aria-hidden="true"></i>
        </span>
      </div>
    </div>
  </article>
</section>
